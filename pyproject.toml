[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "omni_describer_custom.__version__"}

[project]
name = "omni-describer-custom"
dynamic = ["version"]
description = "Accessible audio description tool for blind and visually impaired users"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "wxpython>=4.2",
    "pillow>=10.0",
    "python-vlc>=3.0",
    "edge-tts>=6.1",
    "pyttsx3>=2.90",
    "aiohttp>=3.9",
    "pywin32>=306; sys_platform == 'win32'",
    "yt-dlp>=2025.6.9",
    # Prism: speaks through whatever screen reader is running (NVDA,
    # JAWS, ZDSR, ...) and falls back to SAPI/OneCore when none is, so
    # the app has a voice on a computer that has no screen reader.
    "prismatoid>=0.18.2",
    # 2.1.3: Ed25519 check of the release signature before the app
    # installs an update of itself (core/app_update.verify_signature).
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omni_describer_custom = ["*.py"]

[tool.pytest.ini_options]
# tests/conftest.py collects each standalone gate script as ONE item run in a
# subprocess. The default test_*.py module collector must never import these
# scripts (they run their whole suite at import and os._exit the process).
python_files = "gate_*.py"

[tool.ruff]
# Lint only (no `ruff format`): keeps git blame intact.
target-version = "py311"
extend-exclude = ["build", "dist", "bin", "projects"]

[tool.ruff.lint]
# Bug-catching rules only: syntax errors, invalid comparisons, misplaced
# statements and undefined names. Style rules are deliberately off.
# Phase 37 (8 Oct 2026, owner): bug-catching rules added stage by stage;
# B023 = a closure reading a loop variable (12 found, all used within the
# iteration, marked noqa with that reason).
# 37.2: unused variables, duplicate imports, raise-from, assert False.
select = ["E9", "F63", "F7", "F82", "B023",
          "F841", "F811", "F541", "B007", "B904", "B011",
          # 37.3: unused imports (intentional ones carry noqa with the reason)
          "F401"]
