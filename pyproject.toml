[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "omni_describer_custom.__version__"}

[project]
name = "omni-describer-custom"
dynamic = ["version"]
description = "Accessible audio description tool for blind and visually impaired users"
requires-python = ">=3.11"
dependencies = [
    "wxpython>=4.2",
    "pillow>=10.0",
    "python-vlc>=3.0",
    "edge-tts>=6.1",
    "pyttsx3>=2.90",
    "aiohttp>=3.9",
    "pywin32>=306; sys_platform == 'win32'",
    "yt-dlp>=2025.6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omni_describer_custom = ["*.py"]
