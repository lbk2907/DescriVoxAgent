name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour, including what the screen reader should say and which keys it should use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Describing a video (main window)
        - Player
        - Agent (F2)
        - Characters
        - Editor
        - Settings
        - Import / export
        - Languages / translation
        - Other
  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility
      options:
        - label: This must work fully from the keyboard and be announced by a screen reader.
          required: true
